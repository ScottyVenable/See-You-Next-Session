# Deploy to GitHub Pages
name: Deploy Dev Portal & Game Builds

on:
  push:
    branches: [stable, develop, experimental]
    paths:
      - 'portal/**'
      - 'src/**'
      - 'package.json'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:
    inputs:
      build_branch:
        description: 'Branch to build game from'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - stable
          - develop
          - experimental

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-portal:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout stable branch
        uses: actions/checkout@v4
        with:
          ref: stable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: portal/package-lock.json

      - name: Install portal dependencies
        working-directory: portal
        run: npm ci

      - name: Build portal
        working-directory: portal
        env:
          VITE_DEV_PASSWORD_HASH: ${{ secrets.DEV_PASSWORD_HASH }}
          VITE_REPO_OWNER: ${{ github.repository_owner }}
          VITE_REPO_NAME: ${{ github.event.repository.name }}
        run: npm run build

      - name: Upload portal artifact
        uses: actions/upload-artifact@v4
        with:
          name: portal-dist
          path: portal/dist

  build-game-stable:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/stable' || github.event.inputs.build_branch == 'all' || github.event.inputs.build_branch == 'stable'
    steps:
      - name: Checkout stable
        uses: actions/checkout@v4
        with:
          ref: stable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build game
        run: npm run build

      - name: Upload game artifact
        uses: actions/upload-artifact@v4
        with:
          name: game-stable
          path: dist

  build-game-develop:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop' || github.event.inputs.build_branch == 'all' || github.event.inputs.build_branch == 'develop'
    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build game
        run: npm run build

      - name: Upload game artifact
        uses: actions/upload-artifact@v4
        with:
          name: game-develop
          path: dist

  build-game-experimental:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/experimental' || github.event.inputs.build_branch == 'all' || github.event.inputs.build_branch == 'experimental'
    steps:
      - name: Checkout experimental
        uses: actions/checkout@v4
        with:
          ref: experimental

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build game
        run: npm run build

      - name: Upload game artifact
        uses: actions/upload-artifact@v4
        with:
          name: game-experimental
          path: dist

  combine-and-deploy:
    runs-on: ubuntu-latest
    needs: [build-portal, build-game-stable, build-game-develop, build-game-experimental]
    if: always() && needs.build-portal.result == 'success'
    steps:
      - name: Download portal
        uses: actions/download-artifact@v4
        with:
          name: portal-dist
          path: combined

      - name: Create builds directory
        run: mkdir -p combined/builds

      - name: Download stable game (if exists)
        uses: actions/download-artifact@v4
        with:
          name: game-stable
          path: combined/builds/stable
        continue-on-error: true

      - name: Download develop game (if exists)
        uses: actions/download-artifact@v4
        with:
          name: game-develop
          path: combined/builds/develop
        continue-on-error: true

      - name: Download experimental game (if exists)
        uses: actions/download-artifact@v4
        with:
          name: game-experimental
          path: combined/builds/experimental
        continue-on-error: true

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload combined artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: combined

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: combine-and-deploy
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
