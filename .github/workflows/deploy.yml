name: Deploy Game to Firebase Hosting

on:
  push:
    branches: [ develop, stable, experimental ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for version generation

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Clean and install dependencies (root)
        run: |
          rm -rf node_modules package-lock.json
          npm install

      - name: Build game
        run: npm run build

      - name: Determine channel
        id: channel
        run: |
          if [ "${{ github.ref }}" == "refs/heads/stable" ]; then
            echo "name=stable" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref }}" == "refs/heads/develop" ]; then
            echo "name=dev" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref }}" == "refs/heads/experimental" ]; then
            echo "name=experimental" >> $GITHUB_OUTPUT
          fi

      - name: Deploy to Firebase
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}'
          channelId: ${{ steps.channel.outputs.name }}
          target: game
          projectId: ${{ secrets.FIREBASE_PROJECT_ID }}
          entryPoint: './'
