name: Deploy to Firebase Hosting

on:
  push:
    branches: [ develop, stable, experimental ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies (root)
        run: npm install

      - name: Fix vite permissions
        run: chmod +x node_modules/.bin/vite

      - name: Build game
        run: npm run build

      - name: Install dependencies (portal)
        run: cd portal && npm install

      - name: Fix portal vite permissions
        run: chmod +x portal/node_modules/.bin/vite

      - name: Build portal
        run: cd portal && npm run build

      - name: Determine deployment target
        id: deploy-target
        run: |
          if [ "${{ github.ref }}" == "refs/heads/stable" ]; then
            echo "target=production" >> $GITHUB_OUTPUT
            echo "channel=live" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref }}" == "refs/heads/develop" ]; then
            echo "target=staging" >> $GITHUB_OUTPUT
            echo "channel=staging" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref }}" == "refs/heads/experimental" ]; then
            echo "target=development" >> $GITHUB_OUTPUT
            echo "channel=experimental" >> $GITHUB_OUTPUT
          fi

      - name: Deploy to Firebase
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}'
          channelId: ${{ steps.deploy-target.outputs.channel }}
          target: ${{ steps.deploy-target.outputs.target }}
          projectId: ${{ secrets.FIREBASE_PROJECT_ID }}
          entryPoint: './'
